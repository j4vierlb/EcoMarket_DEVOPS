# Solo los pods de la API pueden conectarse a MySQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-solo-desde-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ecomarket
      ports:
        - port: 3306
