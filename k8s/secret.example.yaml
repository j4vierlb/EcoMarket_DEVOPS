# Ejemplo: NO se aplica con kustomize ni se deben subir contraseñas reales al repositorio.
# El pipeline crea este Secret con contraseñas aleatorias. Para crearlo a mano:
#   kubectl -n ecomarket create secret generic ecomarket-db \
#     --from-literal=DB_USER=ecomarket \
#     --from-literal=DB_PASSWORD=<clave> \
#     --from-literal=DB_ROOT_PASSWORD=<clave-root>
apiVersion: v1
kind: Secret
metadata:
  name: ecomarket-db
  namespace: ecomarket
type: Opaque
stringData:
  DB_USER: ecomarket
  DB_PASSWORD: cambia_esta_clave
  DB_ROOT_PASSWORD: cambia_esta_clave_root
