apiVersion: v1
kind: Service
metadata:
  name: ecomarket
  labels:
    app.kubernetes.io/name: ecomarket
spec:
  selector:
    app.kubernetes.io/name: ecomarket
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecomarket
  labels:
    app.kubernetes.io/name: ecomarket
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ecomarket
  # Despliegue sin cortes: crea un pod nuevo antes de retirar uno viejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecomarket
        app.kubernetes.io/part-of: ecomarket
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas entre nodos cuando hay más de uno
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ecomarket
      # Espera a que MySQL acepte conexiones antes de arrancar la API (evita reinicios en cadena)
      initContainers:
        - name: esperar-mysql
          image: ecomarket
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "until (echo > /dev/tcp/mysql/3306) 2>/dev/null; do echo 'Esperando a MySQL...'; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: app
          image: ecomarket
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ecomarket-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: ecomarket-db, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ecomarket-db, key: DB_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
