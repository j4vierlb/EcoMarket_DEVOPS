# Dependabot revisa cada semana si hay versiones nuevas o vulnerables
# y abre pull requests hacia develop, que pasan por el pipeline completo.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencias, java]
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencias, docker]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencias, ci]
    commit-message:
      prefix: "chore(ci)"
