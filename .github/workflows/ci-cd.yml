name: EcoMarket CI/CD

# Flujo: pruebas → seguridad → imagen → despliegue
#   - Pull requests hacia develop/main: pruebas, seguridad e imagen (sin publicar ni desplegar)
#   - Push a develop: además publica la imagen y la despliega en staging (Docker Compose)
#   - Push a main:    además publica la imagen y la despliega en producción (Kubernetes)
#   - Ejecución manual: igual que un push a la rama elegida; en main permite simular un fallo
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: "Solo en main: desplegar una versión defectuosa para demostrar el rollback automático"
        type: boolean
        default: false

# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/ecomarket

jobs:
  # ---------------------------------------------------------------- 1. Pruebas
  pruebas:
    name: Pruebas unitarias, integración y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify ejecuta: pruebas unitarias (Surefire) → pruebas de integración (Failsafe)
      # → reporte JaCoCo → control de cobertura mínima (falla si es < 80 %)
      - name: Ejecutar pruebas y control de cobertura
        run: ./mvnw -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, os, xml.etree.ElementTree as ET
          print("## 🧪 Pruebas")
          print("| Tipo | Ejecutadas | Fallidas | Errores |")
          print("|------|-----------:|---------:|--------:|")
          for tipo, carpeta in [("Unitarias", "surefire-reports"), ("Integración", "failsafe-reports")]:
              t = f = e = 0
              for archivo in glob.glob(f"target/{carpeta}/TEST-*.xml"):
                  r = ET.parse(archivo).getroot()
                  t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0))
              print(f"| {tipo} | {t} | {f} | {e} |")
          if os.path.exists("target/site/jacoco/jacoco.csv"):
              filas = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
              cub = sum(int(x["LINE_COVERED"]) for x in filas)
              fal = sum(int(x["LINE_MISSED"]) for x in filas)
              print(f"\n**Cobertura de líneas:** {cub / (cub + fal) * 100:.1f} % (mínimo exigido: 80 %)")
          PY

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 30

  # ---------------------------------------------------------------- 2. Seguridad
  seguridad:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publicar resultados en la pestaña Security → Code scanning
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar token de Snyk
        id: token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error title=Falta SNYK_TOKEN::Agrega el secret SNYK_TOKEN en Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@v1

      # Bloqueo: si hay vulnerabilidades de severidad alta o crítica en las dependencias, el pipeline se detiene
      - name: Escanear dependencias (Snyk Open Source)
        id: dependencias
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-dependencias.sarif

      # Bloqueo: si el código tiene problemas de seguridad de severidad alta, el pipeline se detiene
      - name: Analizar código fuente (Snyk Code)
        id: codigo
        if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-codigo.sarif

      # Alertas: los hallazgos quedan visibles en Security → Code scanning, aunque el escaneo falle
      - name: Publicar alertas de dependencias
        if: ${{ !cancelled() && hashFiles('snyk-dependencias.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-dependencias.sarif
          category: snyk-dependencias

      - name: Publicar alertas de código
        if: ${{ !cancelled() && hashFiles('snyk-codigo.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-codigo.sarif
          category: snyk-codigo

      # Monitoreo continuo: Snyk avisa por correo si aparece una vulnerabilidad nueva en lo ya publicado
      - name: Registrar proyecto en Snyk para monitoreo continuo
        if: github.event_name == 'push'
        continue-on-error: true
        run: snyk monitor --project-name="EcoMarket" --target-reference="${{ github.ref_name }}"

      - name: Resumen de seguridad
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## 🔒 Seguridad (Snyk)"
            echo "| Análisis | Resultado | Bloquea si |"
            echo "|----------|-----------|------------|"
            echo "| Dependencias (Open Source) | ${{ steps.dependencias.outcome || 'no ejecutado' }} | severidad alta o crítica |"
            echo "| Código fuente (Snyk Code) | ${{ steps.codigo.outcome || 'no ejecutado' }} | severidad alta |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 3. Imagen
  imagen:
    name: Construir, probar y escanear imagen Docker
    needs: [pruebas, seguridad]   # no se construye nada si fallan las pruebas o la seguridad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # publicar en GitHub Container Registry
      security-events: write
      id-token: write            # firmar las atestaciones (Sigstore)
      attestations: write        # guardar las atestaciones de procedencia y SBOM
    outputs:
      imagen: ${{ steps.publicar.outputs.imagen }}
      digest: ${{ steps.publicar.outputs.digest }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Etiquetas para trazabilidad: sha-<commit>, nombre de la rama y "latest" solo en main.
      # También agrega etiquetas OCI con el commit, la fecha y la URL del repositorio.
      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar que el contenedor arranca y queda saludable
        run: |
          IMAGEN_LOCAL="${IMAGEN}:sha-${GITHUB_SHA::7}"
          docker run -d --name prueba -p 8080:8080 "$IMAGEN_LOCAL"
          for _ in $(seq 1 40); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' prueba)
            [ "$estado" = healthy ] && break
            sleep 3
          done
          echo "Estado del contenedor: $estado"
          echo "Usuario del proceso: $(docker exec prueba id -u) (debe ser distinto de 0)"
          [ "$estado" = healthy ] && [ "$(docker exec prueba id -u)" != 0 ]
          scripts/smoke-test.sh http://localhost:8080
          docker rm -f prueba

      # Bloqueo: vulnerabilidades críticas en la imagen (sistema base + librerías) detienen el pipeline
      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@v1

      - name: Escanear imagen (Snyk Container)
        id: escaneo
        run: |
          snyk container test "${IMAGEN}:sha-${GITHUB_SHA::7}" --file=Dockerfile \
            --severity-threshold=critical --sarif-file-output=snyk-imagen.sarif

      - name: Publicar alertas de la imagen
        if: ${{ !cancelled() && hashFiles('snyk-imagen.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-imagen.sarif
          category: snyk-imagen

      # Solo se publica la imagen exacta que pasó las pruebas y el escaneo, y solo en push a develop/main
      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        id: publicar
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags "$IMAGEN"
          IMAGEN_SHA="${IMAGEN}:sha-${GITHUB_SHA::7}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGEN_SHA")
          echo "imagen=$IMAGEN_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST#*@}" >> "$GITHUB_OUTPUT"

      # SBOM: inventario de todos los componentes de la imagen (sistema, JRE y librerías)
      - name: Generar SBOM de la imagen
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.publicar.outputs.imagen }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      # Atestaciones firmadas: certifican qué commit y qué pipeline produjeron la imagen.
      # Se verifican con: gh attestation verify oci://<imagen> --owner <dueño>
      - name: Firmar procedencia de la imagen
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.publicar.outputs.sha256 }}
          push-to-registry: true

      - name: Firmar SBOM de la imagen
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.publicar.outputs.sha256 }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Resumen de la imagen
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## 🐳 Imagen"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tamaño: $(docker image inspect --format '{{.Size}}' "${IMAGEN}:sha-${GITHUB_SHA::7}" | awk '{printf "%.0f MB", $1/1000000}')"
            echo "- SBOM y procedencia firmados: ${{ steps.publicar.outcome == 'success' && 'sí' || 'no (pull request)' }}"
            echo "- Escaneo Snyk Container (bloquea si hay críticas): ${{ steps.escaneo.outcome }}"
            echo "- Publicada: ${{ steps.publicar.outputs.imagen || 'no (pull request)' }}"
            echo "- Digest: \`${{ steps.publicar.outputs.digest || '-' }}\`"
            echo ""
            echo "Etiquetas:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 4a. Staging
  despliegue-staging:
    name: Desplegar en staging (Docker Compose)
    needs: imagen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:8081
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las contraseñas se generan en cada despliegue y nunca se guardan en el repositorio
      - name: Generar configuración del entorno
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          DB_ROOT_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_ROOT_PASSWORD"
          cat > .env <<EOF
          DB_USER=ecomarket
          DB_PASSWORD=$DB_PASSWORD
          DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD
          APP_REPLICAS=2
          PROXY_PORT=8081
          ECOMARKET_IMAGE=${{ needs.imagen.outputs.imagen }}
          EOF

      - name: Desplegar (MySQL + 2 réplicas de la API + balanceador nginx)
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Prueba de humo
        run: scripts/smoke-test.sh http://localhost:8081

      - name: Verificar balanceo de carga entre réplicas
        run: |
          RESPUESTAS=$(for _ in $(seq 1 20); do curl -s -o /dev/null -D - http://localhost:8081/api/productos | grep -i x-upstream; done | sort -u | wc -l)
          echo "Réplicas distintas que respondieron: $RESPUESTAS"
          [ "$RESPUESTAS" -ge 2 ]

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## 🚀 Staging (Docker Compose)"
            echo "- Imagen: \`${{ needs.imagen.outputs.imagen }}\`"
            echo "- Digest: \`${{ needs.imagen.outputs.digest }}\`"
            echo '```'
            docker compose ps --format 'table {{.Name}}\t{{.Image}}\t{{.Status}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs en caso de error
        if: failure()
        run: docker compose logs --tail=200

      - name: Apagar entorno
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- 4b. Producción
  # Simula una actualización real: el clúster arranca con la versión que ya estaba en producción
  # (etiqueta "produccion"), se actualiza a la nueva sin cortes y, si falla, vuelve atrás solo.
  despliegue-produccion:
    name: Desplegar en producción (Kubernetes)
    needs: imagen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write            # mover la etiqueta "produccion" a la versión desplegada
    env:
      IMAGEN_DESPLIEGUE: ${{ needs.imagen.outputs.imagen }}
      SIMULAR_FALLO: ${{ inputs.simular_fallo == true }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Clúster Kubernetes efímero que simula el entorno cloud de producción
      - name: Crear clúster Kubernetes (kind)
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ecomarket

      # metrics-server permite que el HorizontalPodAutoscaler lea el uso de CPU
      - name: Instalar metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Crear namespace y Secret con credenciales generadas
        run: |
          kubectl apply -f k8s/namespace.yaml
          DB_PASSWORD=$(openssl rand -hex 16)
          DB_ROOT_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_ROOT_PASSWORD"
          kubectl -n ecomarket create secret generic ecomarket-db \
            --from-literal=DB_USER=ecomarket \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_ROOT_PASSWORD="$DB_ROOT_PASSWORD"

      # Estado inicial: la versión que estaba en producción antes de este despliegue
      - name: Restaurar la versión actual de producción
        id: previa
        run: |
          PREVIA="${IMAGEN}:produccion"
          if ! docker pull "$PREVIA"; then
            echo "Primera puesta en producción: no hay versión anterior."
            echo "existe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REVISION=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PREVIA")
          kind load docker-image "$PREVIA" --name ecomarket
          cp -r k8s /tmp/k8s-previa
          sed -i "s|newName: ecomarket|newName: ${IMAGEN}|; s|newTag: local|newTag: produccion|" /tmp/k8s-previa/kustomization.yaml
          kubectl apply -k /tmp/k8s-previa
          kubectl -n ecomarket annotate deployment/ecomarket --overwrite \
            kubernetes.io/change-cause="versión anterior en producción · commit ${REVISION::7}"
          kubectl -n ecomarket rollout status statefulset/mysql --timeout=300s
          kubectl -n ecomarket rollout status deployment/ecomarket --timeout=300s
          echo "existe=true" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION::7}" >> "$GITHUB_OUTPUT"

      - name: Actualizar a la nueva versión (rolling update)
        run: |
          docker pull "$IMAGEN_DESPLIEGUE"
          kind load docker-image "$IMAGEN_DESPLIEGUE" --name ecomarket
          TAG="${IMAGEN_DESPLIEGUE##*:}"
          if [ "$SIMULAR_FALLO" = "true" ]; then
            echo "::warning title=Fallo simulado::Se despliega una imagen inexistente para demostrar el rollback automático"
            TAG="version-defectuosa"
          fi
          sed -i "s|newName: ecomarket|newName: ${IMAGEN}|; s|newTag: local|newTag: ${TAG}|" k8s/kustomization.yaml
          kubectl kustomize k8s | grep "image:"
          kubectl apply -k k8s
          # Trazabilidad: el historial de despliegues registra el commit y la ejecución del pipeline
          kubectl -n ecomarket annotate deployment/ecomarket --overwrite \
            kubernetes.io/change-cause="commit ${GITHUB_SHA::7} · run ${GITHUB_RUN_ID} · ${GITHUB_ACTOR}"

      # Si esta verificación falla, el siguiente paso hace el rollback
      - name: Verificar el despliegue (rollout + prueba de humo)
        id: verificar
        continue-on-error: true
        run: |
          kubectl -n ecomarket rollout status statefulset/mysql --timeout=300s
          kubectl -n ecomarket rollout status deployment/ecomarket --timeout=240s
          kubectl -n ecomarket port-forward svc/ecomarket 8080:80 >/dev/null 2>&1 &
          scripts/smoke-test.sh http://localhost:8080

      - name: Rollback automático
        id: rollback
        if: steps.verificar.outcome == 'failure'
        run: |
          echo "::error title=Despliegue fallido::La nueva versión no pasó la verificación"
          if [ "${{ steps.previa.outputs.existe }}" != "true" ]; then
            echo "No hay versión anterior a la que volver."
            exit 1
          fi
          kubectl -n ecomarket rollout undo deployment/ecomarket
          kubectl -n ecomarket rollout status deployment/ecomarket --timeout=240s
          pkill -f "port-forward" || true
          kubectl -n ecomarket port-forward svc/ecomarket 8081:80 >/dev/null 2>&1 &
          scripts/smoke-test.sh http://localhost:8081
          echo "::notice title=Rollback completado::Producción volvió a la versión ${{ steps.previa.outputs.revision }} y responde correctamente"
          # El despliegue falló aunque el rollback haya salido bien
          exit 1

      # Genera carga real (cada alta de usuario cifra la contraseña con BCrypt, que usa CPU)
      # y registra cómo el HorizontalPodAutoscaler agrega réplicas.
      - name: Prueba de carga y autoescalado
        id: carga
        if: steps.verificar.outcome == 'success'
        run: |
          sleep 30   # metrics-server necesita unos segundos para tener métricas
          kubectl run carga -n default --image=busybox:1.36 --restart=Never -- sh -c '
            for w in $(seq 1 24); do
              ( n=0; while true; do n=$((n+1));
                  wget -q -O /dev/null --header="Content-Type: application/json" \
                    --post-data="{\"nombre\":\"Carga\",\"correo\":\"c${w}x${n}@carga.cl\",\"contrasena\":\"segura123\"}" \
                    http://ecomarket.ecomarket.svc.cluster.local/api/usuarios || true
                done ) &
            done; wait'
          echo "| Segundo | CPU media / objetivo | Réplicas |" > carga.md
          echo "|--------:|----------------------|---------:|" >> carga.md
          MAX=2
          for t in $(seq 0 10 180); do
            CPU=$(kubectl -n ecomarket get hpa ecomarket -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}')
            REP=$(kubectl -n ecomarket get deployment ecomarket -o jsonpath='{.status.readyReplicas}')
            echo "| $t | ${CPU:-?} % / 70 % | ${REP:-?} |" | tee -a carga.md
            [ "${REP:-0}" -gt "$MAX" ] && MAX=$REP
            sleep 10
          done
          kubectl delete pod carga -n default --wait=false
          echo "maximo=$MAX" >> "$GITHUB_OUTPUT"
          if [ "$MAX" -gt 2 ]; then
            echo "::notice title=Autoescalado::El HPA escaló de 2 a $MAX réplicas bajo carga"
          else
            echo "::warning title=Autoescalado::El HPA no alcanzó a escalar durante la prueba"
          fi

      # Solo una versión verificada pasa a ser la referencia de producción para el próximo rollback
      - name: Marcar la versión como actual en producción
        if: steps.verificar.outcome == 'success'
        run: |
          docker tag "$IMAGEN_DESPLIEGUE" "${IMAGEN}:produccion"
          docker push "${IMAGEN}:produccion"

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## ☸️ Producción (Kubernetes)"
            echo "| | |"
            echo "|---|---|"
            echo "| Versión anterior | ${{ steps.previa.outputs.revision || 'ninguna (primer despliegue)' }} |"
            echo "| Versión nueva | \`${IMAGEN_DESPLIEGUE}\` |"
            echo "| Digest | \`${{ needs.imagen.outputs.digest }}\` |"
            echo "| Fallo simulado | ${SIMULAR_FALLO} |"
            echo "| Verificación | ${{ steps.verificar.outcome }} |"
            echo "| Rollback automático | ${{ steps.rollback.outcome == 'skipped' && 'no fue necesario' || steps.rollback.outcome }} |"
            echo "| Réplicas máximas bajo carga | ${{ steps.carga.outputs.maximo || '-' }} |"
            if [ -f carga.md ]; then
              echo ""
              echo "### 📈 Autoescalado durante la prueba de carga"
              cat carga.md
            fi
            echo ""
            echo "### Estado final del clúster"
            echo '```'
            kubectl -n ecomarket get deploy,statefulset,pods,svc,hpa,pdb
            echo ""
            kubectl -n ecomarket rollout history deployment/ecomarket
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico en caso de error
        if: failure() || steps.verificar.outcome == 'failure'
        run: |
          kubectl -n ecomarket get events --sort-by=.lastTimestamp | tail -30
          kubectl -n ecomarket describe pods
          kubectl -n ecomarket logs -l app.kubernetes.io/name=ecomarket --all-containers --tail=100
