# Balanceador de carga delante de las réplicas de la API.
# nginx consulta el DNS interno de Docker, que devuelve la IP de cada réplica de "app",
# y reparte las peticiones entre ellas. Si se escalan las réplicas, las detecta en pocos segundos.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $ecomarket_api http://app:8080;
        proxy_pass $ecomarket_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream $upstream_addr always;
    }
}
